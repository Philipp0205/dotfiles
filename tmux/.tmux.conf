# Clipboard
set -g set-clipboard on
set -ag terminal-overrides ",tmux-256color:Ms=\\E]52;c;%p2%s\\7"
set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;c;%p2%s\\7"

# Wayland clipboard passthrough
set -g allow-passthrough on

# Enable vim keybindings in tmux

# Use vi mode in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Enable clipboard integration
set -s copy-command "wl-copy"

# ── Pane titles ────────────────────────────────────────────────────────────────
# Show a status bar at the top of every pane
set -g pane-border-status top

# Inactive pane: dim grey  |  index · command · full cwd  (no truncation)
set -g pane-border-format "\
#[norange]\
#[fg=colour240,bg=colour235] \
#{pane_index} \
#[fg=colour244]│ \
#[fg=colour250]#{pane_current_command} \
#[fg=colour240]· \
#[fg=colour246]#{pane_current_path} \
#[fg=colour240]│ \
#[fg=colour242]#{pane_title} \
#[fg=colour240,bg=colour235] "

# Active pane: bright, coloured highlight
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style        "fg=colour238"

# Let the shell/program set the pane title automatically via OSC 2
set -g allow-rename on
set -wg automatic-rename on
# Automatic rename template: command (cwd)
set -wg automatic-rename-format "#{pane_current_command} (#{b:pane_current_path})"

# Direct pane navigation shortcuts
bind-key -n M-1 select-pane -t 1
bind-key -n M-2 select-pane -t 2
bind-key -n M-3 select-pane -t 3
bind-key -n M-4 select-pane -t 4
bind-key -n M-0 select-pane -t 0

# Enable mouse support
set -g mouse on
