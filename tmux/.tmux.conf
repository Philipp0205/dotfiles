# Enable vim keybindings in tmux

# Use vi mode in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Enable clipboard integration
set -s copy-command "wl-copy"

# Pane border status and labels
set -g pane-border-status top
set -g pane-border-format "#[fg=colour244,bg=default] #{pane_index} | #{b:pane_current_path} | #{pane_title} "

# Direct pane navigation shortcuts
bind-key -n M-1 select-pane -t 1
bind-key -n M-2 select-pane -t 2
bind-key -n M-3 select-pane -t 3
bind-key -n M-4 select-pane -t 4
bind-key -n M-0 select-pane -t 0

# Enable mouse support
set -g mouse on